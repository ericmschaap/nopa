name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            athlete/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: athlete
      - name: Lint
        run: npm run lint
      - name: Typecheck and unit tests
        run: npm test

  database-and-e2e:
    name: Database rules and end-to-end
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            athlete/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: athlete
      - name: Start local Supabase (applies supabase/migrations)
        run: npm run db:start
      - name: Database and access-rule tests
        run: npm run db:test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end
        run: npm run e2e
      - name: Stop Supabase
        if: always()
        run: npm run db:stop
